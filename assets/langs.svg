<svg xmlns="http://www.w3.org/2000/svg" width="420" height="173" viewBox="0 0 420 173">

<style>
  .bg { fill: #ffffff; }
  .title { font: 600 18px 'Segoe UI', Ubuntu, sans-serif; fill: #c77dff; }
  .label { font: 600 14px 'Segoe UI', Ubuntu, sans-serif; fill: #444441; }
  .value { font: 700 14px 'Segoe UI', Ubuntu, sans-serif; fill: #444441; }
  .hint  { font: 400 12px 'Segoe UI', Ubuntu, sans-serif; fill: #8a8a86; }
  .icon  { fill: #52b788; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .label, .value { fill: #e6edf3; }
    .hint { fill: #8b949e; }
  }
</style>

<rect class="bg" x="0.5" y="0.5" rx="6" width="419" height="172"/>
<text class="title" x="25" y="36">Most Used Languages</text>
<clipPath id="bar"><rect x="25" y="52" rx="4" width="370" height="8"/></clipPath>
<g clip-path="url(#bar)">
<rect x="25.00" y="52" width="165.61" height="8" fill="#e34c26"/>
<rect x="190.61" y="52" width="145.13" height="8" fill="#3178c6"/>
<rect x="335.74" y="52" width="27.84" height="8" fill="#b07219"/>
<rect x="363.57" y="52" width="14.20" height="8" fill="#f1e05a"/>
<rect x="377.77" y="52" width="12.90" height="8" fill="#663399"/>
<rect x="390.67" y="52" width="4.33" height="8" fill="#74283c"/>
</g>
<circle cx="30" cy="83" r="5" fill="#e34c26"/>
<text class="label" x="42" y="88">HTML <tspan class="hint">44.8%</tspan></text>
<circle cx="220" cy="83" r="5" fill="#3178c6"/>
<text class="label" x="232" y="88">TypeScript <tspan class="hint">39.2%</tspan></text>
<circle cx="30" cy="109" r="5" fill="#b07219"/>
<text class="label" x="42" y="114">Java <tspan class="hint">7.5%</tspan></text>
<circle cx="220" cy="109" r="5" fill="#f1e05a"/>
<text class="label" x="232" y="114">JavaScript <tspan class="hint">3.8%</tspan></text>
<circle cx="30" cy="135" r="5" fill="#663399"/>
<text class="label" x="42" y="140">CSS <tspan class="hint">3.5%</tspan></text>
<circle cx="220" cy="135" r="5" fill="#74283c"/>
<text class="label" x="232" y="140">Prolog <tspan class="hint">1.2%</tspan></text>
</svg>