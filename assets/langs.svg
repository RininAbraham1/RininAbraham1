<svg xmlns="http://www.w3.org/2000/svg" width="420" height="173" viewBox="0 0 420 173">

<style>
  .bg { fill: #ffffff; }
  .title { font: 600 18px 'Segoe UI', Ubuntu, sans-serif; fill: #c77dff; }
  .label { font: 600 14px 'Segoe UI', Ubuntu, sans-serif; fill: #444441; }
  .value { font: 700 14px 'Segoe UI', Ubuntu, sans-serif; fill: #444441; }
  .hint  { font: 400 12px 'Segoe UI', Ubuntu, sans-serif; fill: #8a8a86; }
  .icon  { fill: #52b788; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .label, .value { fill: #e6edf3; }
    .hint { fill: #8b949e; }
  }
</style>

<rect class="bg" x="0.5" y="0.5" rx="6" width="419" height="172"/>
<text class="title" x="25" y="36">Most Used Languages</text>
<clipPath id="bar"><rect x="25" y="52" rx="4" width="370" height="8"/></clipPath>
<g clip-path="url(#bar)">
<rect x="25.00" y="52" width="177.73" height="8" fill="#e34c26"/>
<rect x="202.73" y="52" width="155.75" height="8" fill="#3178c6"/>
<rect x="358.48" y="52" width="15.24" height="8" fill="#f1e05a"/>
<rect x="373.72" y="52" width="13.66" height="8" fill="#663399"/>
<rect x="387.38" y="52" width="4.65" height="8" fill="#74283c"/>
<rect x="392.02" y="52" width="2.98" height="8" fill="#3572A5"/>
</g>
<circle cx="30" cy="83" r="5" fill="#e34c26"/>
<text class="label" x="42" y="88">HTML <tspan class="hint">48.0%</tspan></text>
<circle cx="220" cy="83" r="5" fill="#3178c6"/>
<text class="label" x="232" y="88">TypeScript <tspan class="hint">42.1%</tspan></text>
<circle cx="30" cy="109" r="5" fill="#f1e05a"/>
<text class="label" x="42" y="114">JavaScript <tspan class="hint">4.1%</tspan></text>
<circle cx="220" cy="109" r="5" fill="#663399"/>
<text class="label" x="232" y="114">CSS <tspan class="hint">3.7%</tspan></text>
<circle cx="30" cy="135" r="5" fill="#74283c"/>
<text class="label" x="42" y="140">Prolog <tspan class="hint">1.3%</tspan></text>
<circle cx="220" cy="135" r="5" fill="#3572A5"/>
<text class="label" x="232" y="140">Python <tspan class="hint">0.8%</tspan></text>
</svg>