<svg xmlns="http://www.w3.org/2000/svg" width="420" height="248" viewBox="0 0 420 248">

<style>
  .bg { fill: #ffffff; }
  .title { font: 600 18px 'Segoe UI', Ubuntu, sans-serif; fill: #c77dff; }
  .label { font: 600 14px 'Segoe UI', Ubuntu, sans-serif; fill: #444441; }
  .value { font: 700 14px 'Segoe UI', Ubuntu, sans-serif; fill: #444441; }
  .hint  { font: 400 12px 'Segoe UI', Ubuntu, sans-serif; fill: #8a8a86; }
  .icon  { fill: #52b788; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .label, .value { fill: #e6edf3; }
    .hint { fill: #8b949e; }
  }
</style>

<rect class="bg" x="0.5" y="0.5" rx="6" width="419" height="247"/>
<text class="title" x="25" y="36">Rinin Abraham's GitHub Stats</text>
<circle class="icon" cx="31" cy="57" r="4"/>
<text class="label" x="45" y="62">Total Stars Earned:</text>
<text class="value" x="390" y="62" text-anchor="end">1</text>
<circle class="icon" cx="31" cy="83" r="4"/>
<text class="label" x="45" y="88">Commits (last year):</text>
<text class="value" x="390" y="88" text-anchor="end">90</text>
<circle class="icon" cx="31" cy="109" r="4"/>
<text class="label" x="45" y="114">Pull Requests:</text>
<text class="value" x="390" y="114" text-anchor="end">18</text>
<circle class="icon" cx="31" cy="135" r="4"/>
<text class="label" x="45" y="140">Merged PRs:</text>
<text class="value" x="390" y="140" text-anchor="end">17</text>
<circle class="icon" cx="31" cy="161" r="4"/>
<text class="label" x="45" y="166">Issues:</text>
<text class="value" x="390" y="166" text-anchor="end">1</text>
<circle class="icon" cx="31" cy="187" r="4"/>
<text class="label" x="45" y="192">Contributed to (last year):</text>
<text class="value" x="390" y="192" text-anchor="end">2</text>
<text class="hint" x="25" y="230">Pull Shark next tier: 17/128 merged PRs</text>
</svg>